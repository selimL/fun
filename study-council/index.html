<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Council</title>
  <link rel="stylesheet" href="vendor/katex.min.css" />
  <link rel="stylesheet" href="vendor/hljs/github-dark.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">◈</div>
        <div>
          <div class="brand-name">Study Council</div>
          <div class="brand-tag" data-i18n="tagline"></div>
        </div>
      </div>
      <button class="btn primary wide" id="newChat" data-i18n="newChat"></button>
      <div class="side-label" data-i18n="history"></div>
      <div class="history" id="history"></div>
      <div class="side-foot">
        <div class="status" id="status"><span class="dot"></span><span class="status-text">…</span></div>
        <div class="side-row">
          <div class="seg" id="langSeg">
            <button data-lang="en">EN</button><button data-lang="tr">TR</button>
          </div>
          <button class="btn ghost" id="openSettings">⚙ <span data-i18n="settings"></span></button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="subjects-head">
          <button class="btn ghost icon only-mobile" id="toggleSidebar" aria-label="Menu">☰</button>
          <span class="label" data-i18n="subjects"></span>
          <span class="mode-badge" id="modeBadge"></span>
          <span class="spacer"></span>
          <button class="btn ghost small" id="suggestBtn" data-i18n="suggest"></button>
          <button class="btn ghost small" id="clearSubjects" data-i18n="clear"></button>
          <button class="btn ghost small icon" id="collapseSubjects" aria-label="Collapse">▴</button>
        </div>
        <div class="subjects" id="subjects"></div>
      </header>

      <section class="thread" id="thread"></section>

      <footer class="composer">
        <div class="thumbs" id="thumbs"></div>
        <div class="composer-box" id="dropZone">
          <button class="btn ghost icon" id="attachBtn" data-i18n-title="attach">📎</button>
          <input type="file" id="fileInput" accept="image/*" multiple hidden />
          <textarea id="input" rows="1"></textarea>
          <button class="btn primary" id="sendBtn" data-i18n="send"></button>
        </div>
        <div class="composer-meta">
          <span class="label" data-i18n="output"></span>
          <div class="seg" id="outputSeg">
            <button data-out="answer" data-i18n="outAnswer"></button>
            <button data-out="doc" data-i18n="outDoc"></button>
            <button data-out="sheet" data-i18n="outSheet"></button>
            <button data-out="slides" data-i18n="outSlides"></button>
          </div>
          <span class="hint" id="pickHint" data-i18n="pickHint"></span>
        </div>
      </footer>
    </main>
  </div>

  <dialog id="settings">
    <form method="dialog" class="settings">
      <h2 data-i18n="settings"></h2>

      <h3 data-i18n="sConnection"></h3>
      <div class="row">
        <label class="grow"><span data-i18n="sHost"></span><input id="sHost" /></label>
        <button type="button" class="btn" id="sTest" data-i18n="sTest"></button>
      </div>
      <details class="help"><summary data-i18n="sSetup"></summary><div data-i18n-html="setupHelp"></div></details>

      <h3 data-i18n="sModels"></h3>
      <div class="grid2">
        <label><span data-i18n="sDefault"></span><select id="sDefault"></select></label>
        <label><span data-i18n="sMath"></span><select id="sMath"></select></label>
        <label><span data-i18n="sCode"></span><select id="sCode"></select></label>
        <label><span data-i18n="sVision"></span><select id="sVision"></select></label>
      </div>
      <details><summary data-i18n="sPerSubject"></summary><div class="grid2" id="perSubject"></div></details>

      <h3 data-i18n="sPresets"></h3>
      <p class="muted" data-i18n="sPresetHint"></p>
      <div id="presets"></div>

      <h3 data-i18n="sQuality"></h3>
      <label class="check"><input type="checkbox" id="sTools" /> <span data-i18n="sTools"></span></label>
      <label class="check"><input type="checkbox" id="sThink" /> <span data-i18n="sThink"></span></label>
      <label class="check"><input type="checkbox" id="sVerify" /> <span data-i18n="sVerify"></span></label>
      <div class="grid2">
        <label><span data-i18n="sRounds"></span>
          <select id="sRounds"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
        <label><span data-i18n="sCtx"></span>
          <select id="sCtx"><option>8192</option><option>16384</option><option>32768</option><option>65536</option></select></label>
      </div>

      <div class="dialog-actions"><button class="btn primary" data-i18n="sClose"></button></div>
    </form>
  </dialog>

  <script src="vendor/katex.min.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/hljs/highlight.min.js"></script>
  <script src="vendor/math.min.js"></script>
  <script src="vendor/docx.iife.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/pptxgen.bundle.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/subjects.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/ollama.js"></script>
  <script src="js/render.js"></script>
  <script src="js/exporters.js"></script>
  <script src="js/council.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
